<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>COOLT EDITOR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:Gotthard;src:url(assets/gotthard.otf)}
:root{--ink:#101114;--slate:#1a1c21;--line:#2c2f36;--bone:#f2f2ef;--mute:#8b9099;--ice:#7fd1ff;--s:min(100vw,42dvh,540px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--bone);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px}
header img{height:22px}
header b{font:400 17px Gotthard,sans-serif;letter-spacing:.16em}
.stage{width:var(--s);height:var(--s);margin:0 auto;background:#000;flex:none;box-shadow:0 0 0 1px var(--line)}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
nav{display:flex;gap:4px;padding:10px 12px 8px;flex:none}
nav button{flex:1;padding:10px 0;border:0;border-bottom:2px solid var(--line);background:none;color:var(--mute);font:inherit;font-weight:600}
nav button.on{color:var(--bone);border-color:var(--ice)}
main{flex:1;overflow-y:auto;padding:6px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sec{display:none}.sec.on{display:block}
.row{margin:14px 0}
.row>label{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:6px}
.row output{color:var(--bone);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ice);height:28px;margin:0}
select,textarea,input[type=text],input[type=number]{width:100%;background:var(--slate);color:var(--bone);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit}
textarea{resize:vertical;min-height:64px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{flex:1 1 auto;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--slate);color:var(--bone);font:inherit;font-weight:600;text-align:center;cursor:pointer}
.btn.main{background:var(--ice);color:#06141d;border-color:var(--ice);padding:15px;font-size:16px;width:100%}
.btn:active{opacity:.7}
.col{display:flex;align-items:center;gap:8px}
.col input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--slate);padding:2px}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid #555;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--slate);color:var(--bone);font:inherit;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--ice);color:var(--ice)}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0}.chk input{width:22px;height:22px;accent-color:var(--ice)}
.hint{color:var(--mute);font-size:13px;margin:10px 0}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;text-align:center}
#dl{position:fixed;inset:0;background:rgba(10,11,13,.96);z-index:9;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;overflow:auto}
#dl[hidden]{display:none}#dl img{max-width:100%;max-height:60dvh;object-fit:contain}
</style>
</head>
<body>
<div id="app">
<header><img src="assets/coolt.png" alt="COOLT" style="filter:invert(0)"><b>COOLT EDITOR</b></header>
<div class="stage" id="stage"><canvas id="cv"></canvas></div>
<nav id="tabs"><button data-t="bg" class="on">Фон</button><button data-t="logo">Лого</button><button data-t="text">Текст</button><button data-t="export">Экспорт</button></nav>
<main id="panel"></main>
</div>
<div id="dl" hidden><p style="text-align:center;margin:0">Нажмите на обложку и удерживайте, чтобы сохранить в галерею</p><img id="dlimg" alt=""><div class="btns" style="width:100%;max-width:420px"><button class="btn" id="dlweb">Открыть в браузере</button><button class="btn" id="dlclose">Закрыть</button></div></div>

<script>
const D0=1254, $=s=>document.querySelector(s);
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.setHeaderColor('#101114');tg.setBackgroundColor('#101114')}catch(e){}}

/* ---------- состояние ---------- */
const T=(o={})=>Object.assign({id:'t'+Math.random().toString(36).slice(2,7),text:'Текст',x:627,y:300,size:80,color:'#ffffff',opacity:1,track:0,lh:1.1,bold:0,rot:0,align:'center',upper:false},o);
const S={
 bg:{img:null,w:0,h:0,x:0,y:0,scale:1,rot:0,flip:false,dim:0,fill:'#15171a'},
 logo:{on:true,color:'#ffffff',opacity:.9,thick:0,blend:'source-over'},
 layers:[T({id:'num',text:'CLT 962',x:1045.7,y:907.1,size:30,align:'left'})],
 sel:0, fmt:'image/png', size:3000, q:.92, tab:'bg'
};
const logoImg=new Image(); logoImg.src='assets/logo.png';
const cur=()=>S.layers[S.sel];
const root=p=>p.startsWith('T.')?[cur(),p.slice(2)]:[S[p.split('.')[0]],p.split('.')[1]];

/* ---------- интерфейс ---------- */
const R=(l,p,a,b,st)=>`<div class="row"><label>${l}<output data-o="${p}"></output></label><input type="range" data-p="${p}" min="${a}" max="${b}" step="${st}"></div>`;
const SW=['#ffffff','#000000','#7fd1ff','#ff4d4d','#ffd84d'];
const C=(l,p)=>`<div class="row"><label>${l}</label><div class="col"><input type="color" data-p="${p}">${SW.map(c=>`<button class="sw" data-sw="${p}" data-c="${c}" style="background:${c}"></button>`).join('')}</div></div>`;
const CHK=(l,p)=>`<label class="chk"><input type="checkbox" data-p="${p}">${l}</label>`;
$('#panel').innerHTML=`
<section class="sec on" data-s="bg">
 <label class="btn main" style="display:block">Загрузить изображение<input type="file" id="file" accept="image/*" hidden></label>
 <p class="hint">Двигайте фото пальцем или мышью. Масштаб — щипком или колесом мыши.</p>
 <div class="btns"><button class="btn" id="bFill">Заполнить</button><button class="btn" id="bFit">Вписать</button><button class="btn" id="bRot">Повернуть 90°</button><button class="btn" id="bFlip">Отразить</button><button class="btn" id="bReset">Сброс</button></div>
 ${R('Масштаб','bg.scale',.1,5,.01)}${R('Поворот','bg.rot',-180,180,1)}${R('Затемнение','bg.dim',0,.9,.01)}${C('Цвет подложки','bg.fill')}
</section>
<section class="sec" data-s="logo">
 ${CHK('Показывать лого','logo.on')}${C('Цвет лого','logo.color')}${R('Прозрачность','logo.opacity',0,1,.01)}${R('Толщина линий','logo.thick',0,14,.5)}
 <div class="row"><label>Наложение</label><select data-p="logo.blend"><option value="source-over">Обычное</option><option value="overlay">Overlay</option><option value="soft-light">Мягкий свет</option><option value="screen">Экран</option><option value="multiply">Умножение</option><option value="difference">Разница</option><option value="color-dodge">Осветление</option><option value="exclusion">Исключение</option></select></div>
 <p class="hint">Положение лого зафиксировано по шаблону лейбла.</p>
</section>
<section class="sec" data-s="text">
 <div class="chips" id="chips"></div>
 <div class="btns"><button class="btn" id="tAdd">+ Добавить текст</button><button class="btn" id="tDel">Удалить слой</button></div>
 <div class="row" id="numRow"><label>Номер трека</label><input type="number" id="num" inputmode="numeric" placeholder="962"></div>
 <div class="row"><label>Текст</label><textarea data-p="T.text"></textarea></div>
 <p class="hint">Шрифт — Gotthard. Перетаскивайте выбранный текст прямо по обложке.</p>
 ${R('Размер','T.size',8,400,1)}${R('Положение X','T.x',-200,1454,1)}${R('Положение Y','T.y',-200,1454,1)}${C('Цвет','T.color')}${R('Прозрачность','T.opacity',0,1,.01)}${R('Жирность','T.bold',0,14,.5)}${R('Межбуквенный интервал','T.track',-10,80,1)}${R('Межстрочный интервал','T.lh',.6,2.5,.05)}${R('Поворот','T.rot',-180,180,1)}
 <div class="row"><label>Выравнивание</label><select data-p="T.align"><option value="left">По левому краю</option><option value="center">По центру</option><option value="right">По правому краю</option></select></div>
 ${CHK('Все буквы заглавные','T.upper')}
</section>
<section class="sec" data-s="export">
 <div class="row"><label>Формат</label><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option></select></div>
 <div class="row"><label>Размер</label><select id="size"><option value="3000">3000 × 3000</option><option value="2000">2000 × 2000</option><option value="1500">1500 × 1500</option><option value="1000">1000 × 1000</option></select></div>
 <div class="row" id="qRow"><label>Качество<output data-o="q"></output></label><input type="range" data-p="q" min=".5" max="1" step=".01"></div>
 <button class="btn main" id="go">Скачать на устройство</button>
 <p class="hint" id="status"></p>
 <p class="hint">JPG не поддерживает прозрачность, пустые места зальются цветом подложки.</p>
</section>
<footer>COOLT EDITOR<br>Разработчик Фёдоров И.Е. Специально для лейбла COOLT</footer>`;
// footer внутри последней секции не нужен — переносим в конец панели
$('#panel').appendChild($('footer'));

function sync(){
 document.querySelectorAll('[data-p]').forEach(el=>{const[o,k]=root(el.dataset.p);if(!o)return;
  if(el.type==='checkbox')el.checked=!!o[k];else el.value=o[k];
  const out=document.querySelector(`[data-o="${el.dataset.p}"]`);if(out)out.textContent=Math.round(o[k]*100)/100});
 $('#fmt').value=S.fmt;$('#size').value=S.size;$('#qRow').style.display=S.fmt==='image/png'?'none':'';
 const n=cur().id==='num';$('#numRow').style.display=n?'':'none';$('#tDel').style.display=n?'none':'';
 if(n)$('#num').value=cur().text.replace(/^\D*/,'');
 $('#chips').innerHTML=S.layers.map((l,i)=>`<button class="chip ${i===S.sel?'on':''}" data-i="${i}">${l.id==='num'?'№ '+l.text:(l.text.split('\n')[0]||'…')}</button>`).join('');
}
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='num'){cur().text='CLT '+el.value.replace(/\D/g,'');draw();chipsOnly();return}
 if(el.id==='fmt'){S.fmt=el.value;sync();return}
 if(el.id==='size'){S.size=+el.value;return}
 if(!el.dataset.p)return;
 const[o,k]=root(el.dataset.p);
 o[k]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;
 const out=document.querySelector(`[data-o="${el.dataset.p}"]`);if(out)out.textContent=Math.round(o[k]*100)/100;
 if(el.dataset.p==='T.text')chipsOnly();
 draw();
});
function chipsOnly(){const c=$('#chips').children[S.sel];if(c)c.textContent=cur().id==='num'?'№ '+cur().text:(cur().text.split('\n')[0]||'…')}
document.addEventListener('click',e=>{
 const sw=e.target.closest('[data-sw]');if(sw){const[o,k]=root(sw.dataset.sw);o[k]=sw.dataset.c;sync();draw()}
 const ch=e.target.closest('.chip');if(ch){S.sel=+ch.dataset.i;sync()}
});
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.dataset.s===S.tab));$('#panel').scrollTop=0};
$('#tAdd').onclick=()=>{S.layers.push(T());S.sel=S.layers.length-1;sync();draw()};
$('#tDel').onclick=()=>{if(cur().id==='num')return;S.layers.splice(S.sel,1);S.sel=0;sync();draw()};

/* ---------- фон ---------- */
const eff=()=>{const o=Math.round(S.bg.rot/90)%2!==0;return o?[S.bg.h,S.bg.w]:[S.bg.w,S.bg.h]};
const base=()=>{const[w,h]=eff();return Math.max(D0/w,D0/h)};
function setFit(m){if(!S.bg.img)return;const[w,h]=eff();S.bg.scale=m?Math.min(D0/w,D0/h)/base():1;S.bg.x=S.bg.y=0;sync();draw()}
$('#bFill').onclick=()=>setFit(0);$('#bFit').onclick=()=>setFit(1);
$('#bRot').onclick=()=>{S.bg.rot=((S.bg.rot+90+180)%360)-180;setFit(0)};
$('#bFlip').onclick=()=>{S.bg.flip=!S.bg.flip;draw()};
$('#bReset').onclick=()=>{Object.assign(S.bg,{x:0,y:0,scale:1,rot:0,flip:false,dim:0});sync();draw()};
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{let src=im,w=im.naturalWidth,h=im.naturalHeight;const m=Math.max(w,h);
  if(m>4096){const k=4096/m,c=document.createElement('canvas');c.width=w=Math.round(w*k);c.height=h=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,w,h);src=c}
  Object.assign(S.bg,{img:src,w,h,x:0,y:0,scale:1,rot:0,flip:false});URL.revokeObjectURL(u);sync();draw()};
 im.onerror=()=>alert('Не удалось открыть файл. Попробуйте JPG или PNG.');im.src=u;e.target.value=''};

/* ---------- отрисовка ---------- */
const cv=$('#cv');let lcKey='',lc=null;
function logoCanvas(D){
 const key=[D,S.logo.color,S.logo.thick].join('|');if(key===lcKey)return lc;
 const c=document.createElement('canvas');c.width=c.height=D;const x=c.getContext('2d');x.imageSmoothingQuality='high';
 const r=S.logo.thick*D/D0;x.drawImage(logoImg,0,0,D,D);
 if(r>.01)for(const rr of(r>3?[r/2,r]:[r]))for(let i=0;i<24;i++){const a=i/24*Math.PI*2;x.drawImage(logoImg,Math.cos(a)*rr,Math.sin(a)*rr,D,D)}
 x.globalCompositeOperation='source-in';x.fillStyle=S.logo.color;x.fillRect(0,0,D,D);lcKey=key;return lc=c}
function drawText(x,L,k){
 const txt=L.upper?L.text.toUpperCase():L.text;const lines=txt.split('\n');
 x.save();x.translate(L.x*k,L.y*k);x.rotate(L.rot*Math.PI/180);
 x.font=`${L.size*k}px Gotthard`;x.textBaseline='alphabetic';x.textAlign='left';x.globalAlpha=L.opacity;
 x.fillStyle=x.strokeStyle=L.color;x.lineJoin='round';x.lineWidth=L.bold*k;
 lines.forEach((ln,i)=>{const ch=[...ln],ws=ch.map(c=>x.measureText(c).width),tr=L.track*k*L.size/100*1.0;
  const tot=ws.reduce((a,b)=>a+b,0)+tr*Math.max(0,ch.length-1);
  let px=L.align==='center'?-tot/2:L.align==='right'?-tot:0;const py=i*L.size*L.lh*k;
  ch.forEach((c,j)=>{if(L.bold>0)x.strokeText(c,px,py);x.fillText(c,px,py);px+=ws[j]+tr})});
 x.restore()}
function render(c,D,preview){
 const x=c.getContext('2d'),k=D/D0;x.imageSmoothingQuality='high';x.globalAlpha=1;x.globalCompositeOperation='source-over';
 x.fillStyle=S.bg.fill;x.fillRect(0,0,D,D);
 const b=S.bg;
 if(b.img){x.save();x.translate(D/2+b.x*k,D/2+b.y*k);x.rotate(b.rot*Math.PI/180);const s=base()*b.scale*k;x.scale(b.flip?-s:s,s);x.drawImage(b.img,-b.w/2,-b.h/2);x.restore()}
 else if(preview){x.fillStyle='#6b717b';x.font=`${D*.04}px system-ui`;x.textAlign='center';x.fillText('Загрузите изображение во вкладке «Фон»',D/2,D*.4)}
 if(b.dim>0){x.fillStyle=`rgba(0,0,0,${b.dim})`;x.fillRect(0,0,D,D)}
 if(S.logo.on&&logoImg.complete){x.globalAlpha=S.logo.opacity;x.globalCompositeOperation=S.logo.blend;x.drawImage(logoCanvas(D),0,0);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
 S.layers.forEach(L=>drawText(x,L,k));
}
let raf=0;function draw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
 const css=cv.clientWidth||300,D=Math.min(1400,Math.round(css*Math.min(devicePixelRatio||1,3)));
 if(cv.width!==D)cv.width=cv.height=D;render(cv,D,true)})}
new ResizeObserver(draw).observe($('#stage'));logoImg.onload=draw;

/* ---------- жесты на обложке ---------- */
const P=new Map();let pinch=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const[a,b]=[...P.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;const f=D0/cv.clientWidth;
 if(P.size===2){P.set(e.pointerId,[e.clientX,e.clientY]);const[a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch&&S.bg.img){S.bg.scale=Math.min(5,Math.max(.1,S.bg.scale*d/pinch));sync();draw()}pinch=d;return}
 const dx=(e.clientX-p[0])*f,dy=(e.clientY-p[1])*f;P.set(e.pointerId,[e.clientX,e.clientY]);
 if(S.tab==='text'){const L=cur();L.x=Math.round(L.x+dx);L.y=Math.round(L.y+dy)}else if(S.bg.img){S.bg.x+=dx;S.bg.y+=dy}
 sync();draw()});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{P.delete(e.pointerId);pinch=0}));
cv.addEventListener('wheel',e=>{e.preventDefault();if(!S.bg.img)return;S.bg.scale=Math.min(5,Math.max(.1,S.bg.scale*(e.deltaY<0?1.05:.95)));sync();draw()},{passive:false});

/* ---------- экспорт ---------- */
let busy=false;
async function makeBlob(){
 await document.fonts.load('40px Gotthard');await document.fonts.ready;
 const c=document.createElement('canvas');c.width=c.height=S.size;
 const x=c.getContext('2d');
 if(S.fmt==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,S.size,S.size)}
 render(c,S.size,false);
 return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('toBlob')),S.fmt,S.q))}
$('#go').onclick=async()=>{
 if(busy)return;busy=true;const st=$('#status'),btn=$('#go');btn.textContent='Готовлю файл…';st.textContent='';
 try{
  const blob=await makeBlob(),ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[blob.type]||'png';
  const num=(S.layers[0].text.match(/\d+/)||['cover'])[0],name=`COOLT_${num}.${ext}`;
  const file=new File([blob],name,{type:blob.type});
  const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(mobile){
   if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});st.textContent='Готово: '+name;return}catch(e){if(e.name==='AbortError')return}}
   $('#dlimg').src=URL.createObjectURL(blob);$('#dl').hidden=false;
  }else{
   const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),20000);st.textContent=`Сохранено: ${name} (${S.size}×${S.size})`}
 }catch(err){st.textContent='Не удалось создать файл. Выберите размер поменьше (2000 или 1500) и повторите.'}
 finally{busy=false;btn.textContent='Скачать на устройство'}};
$('#dlclose').onclick=()=>{$('#dl').hidden=true};
$('#dlweb').onclick=()=>{const u=location.href;tg&&tg.openLink?tg.openLink(u,{try_instant_view:false}):window.open(u,'_blank')};

sync();document.fonts.load('30px Gotthard').then(draw);draw();
</script>
</body>
</html>
